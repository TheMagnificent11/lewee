name: 'Generate Enhanced Code Coverage Report'
description: 'Generate clean code coverage report using reportgenerator to avoid duplicates'
inputs:
  coverage-reports:
    description: 'Path pattern to coverage reports (e.g., coverage/**/coverage.cobertura.xml)'
    required: true
  output-file:
    description: 'Output file path for the markdown report'
    required: false
    default: 'code-coverage-results.md'
  fail-under:
    description: 'Minimum coverage percentage to pass'
    required: false
    default: '0'
outputs:
  coverage-percentage:
    description: 'Overall line coverage percentage'
    value: ${{ steps.coverage.outputs.coverage-percentage }}
  
runs:
  using: 'composite'
  steps:
    - name: Install ReportGenerator
      shell: bash
      run: |
        dotnet tool install --global dotnet-reportgenerator-globaltool --version 5.4.16

    - name: Generate Coverage Report
      id: coverage
      shell: bash
      run: |
        # Create output directory
        mkdir -p coverage-output
        
        # Generate markdown summary using reportgenerator
        reportgenerator \
          -reports:"${{ inputs.coverage-reports }}" \
          -targetdir:"coverage-output" \
          -reporttypes:"MarkdownSummary" \
          -verbosity:"Warning"
        
        # Extract overall coverage percentage from the markdown file
        COVERAGE_PERCENT=$(grep "Line coverage:" coverage-output/Summary.md | sed 's/.*| \([0-9.]*\)% .*/\1/')
        echo "coverage-percentage=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
        
        # Create PR comment friendly markdown
        cat > "${{ inputs.output-file }}" << 'EOF'
        ## 📊 Code Coverage Report
        
        EOF
        
        # Extract the coverage table from the generated markdown and format it
        sed -n '/^|.*Name.*|.*Line coverage.*|/,/^$/p' coverage-output/Summary.md >> "${{ inputs.output-file }}"
        
        # Add summary information
        echo "" >> "${{ inputs.output-file }}"
        echo "**Overall Coverage:** ${COVERAGE_PERCENT}%" >> "${{ inputs.output-file }}"
        
        # Extract key metrics
        COVERED_LINES=$(grep "Covered lines:" coverage-output/Summary.md | sed 's/.*| \([0-9]*\) |/\1/')
        TOTAL_LINES=$(grep "Coverable lines:" coverage-output/Summary.md | sed 's/.*| \([0-9]*\) |/\1/')
        BRANCH_COVERAGE=$(grep "Branch coverage:" coverage-output/Summary.md | sed 's/.*| \([0-9.]*\)% .*/\1/')
        
        echo "- **Line Coverage:** ${COVERAGE_PERCENT}% (${COVERED_LINES}/${TOTAL_LINES} lines)" >> "${{ inputs.output-file }}"
        echo "- **Branch Coverage:** ${BRANCH_COVERAGE}%" >> "${{ inputs.output-file }}"
        
        echo "Generated coverage report with ${COVERAGE_PERCENT}% line coverage"

    - name: Check Coverage Threshold
      shell: bash
      run: |
        COVERAGE_PERCENT="${{ steps.coverage.outputs.coverage-percentage }}"
        FAIL_UNDER="${{ inputs.fail-under }}"
        
        # Use awk for floating point comparison
        if [ "$(echo "$COVERAGE_PERCENT $FAIL_UNDER" | awk '{print ($1 < $2)}')" = "1" ]; then
          echo "❌ Coverage ($COVERAGE_PERCENT%) is below threshold ($FAIL_UNDER%)"
          exit 1
        else
          echo "✅ Coverage ($COVERAGE_PERCENT%) meets threshold ($FAIL_UNDER%)"
        fi