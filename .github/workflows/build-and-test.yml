on:
  workflow_call:
    inputs:
      is-pr:
        required: false
        type: boolean

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.*

      - name: Install Aspire Workload
        run: dotnet workload install aspire

      - name: Install dotnet-coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Install HTTPS development certificate
        run: dotnet dev-certs https --trust
  
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0.x'
          preferLatestVersion: true
          includePrerelease: true

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          useConfigFile: true

      - name: Install Dependencies
        run: dotnet restore ./lewee.sln --nologo

      - name: Build
        run: dotnet build ./lewee.sln --configuration Release --no-restore --nologo

      - name: Test (Unit Tests Only for Coverage)
        run: |
          # Create coverage directory
          mkdir -p ./coverage
          # Run unit tests for coverage to avoid third-party library coverage
          dotnet-coverage collect "dotnet test tests/Lewee.Domain.Tests.Unit/Lewee.Domain.Tests.Unit.csproj --configuration Release --no-build --nologo" --include-files "src/Lewee.*/bin/Release/net9.0/Lewee.*.dll" -f cobertura -o ./coverage/domain-coverage.cobertura.xml
          dotnet-coverage collect "dotnet test tests/Lewee.Application.Tests.Unit/Lewee.Application.Tests.Unit.csproj --configuration Release --no-build --nologo" --include-files "src/Lewee.*/bin/Release/net9.0/Lewee.*.dll" -f cobertura -o ./coverage/application-coverage.cobertura.xml
          dotnet-coverage collect "dotnet test tests/Lewee.Shared.Tests.Unit/Lewee.Shared.Tests.Unit.csproj --configuration Release --no-build --nologo" --include-files "src/Lewee.*/bin/Release/net9.0/Lewee.*.dll" -f cobertura -o ./coverage/shared-coverage.cobertura.xml
          dotnet-coverage collect "dotnet test sample-tests/Pizzeria.Store.Domain.Tests/Pizzeria.Store.Domain.Tests.csproj --configuration Release --no-build --nologo" --include-files "src/Lewee.*/bin/Release/net9.0/Lewee.*.dll" -f cobertura -o ./coverage/pizzeria-coverage.cobertura.xml
          # Merge coverage files
          dotnet-coverage merge "./coverage/*-coverage.cobertura.xml" -f cobertura -o ./coverage/coverage.cobertura.xml
          # Run integration tests separately without coverage to verify they work (allowed to fail)
          dotnet test sample-tests/Pizzeria.Tests.Integration/Pizzeria.Tests.Integration.csproj --configuration Release --no-build --nologo || true

      - name: Install ReportGenerator
        if: ${{ inputs.is-pr == true }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Generate Coverage Report
        if: ${{ inputs.is-pr == true }}
        run: |
          reportgenerator \
            -reports:"coverage/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" \
            -verbosity:"Warning"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ inputs.is-pr == true }}
        with:
          recreate: true
          path: coverage-report/SummaryGithub.md

      - name: Simple Diff Coverage Check
        if: ${{ inputs.is-pr == true }}
        run: |
          # Get list of changed .cs files
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.cs$' | grep '^src/' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "No source code files changed. Coverage check passed."
            exit 0
          else
            echo "Source code files changed:"
            echo "$CHANGED_FILES"
            echo "⚠️ Note: Diff coverage threshold checking is not yet implemented."
            echo "Please ensure your changes have adequate test coverage."
            # For now, we don't fail the build - just provide guidance
            exit 0
          fi

      - name: Pack
        run: dotnet pack ./lewee.sln --configuration Release --nologo /p:PackageVersion=${{ steps.version.outputs.fullSemVer }} --output ./output

      - name: Publish to NuGet
        run: dotnet nuget push ./output/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: github.ref == 'refs/heads/main'
