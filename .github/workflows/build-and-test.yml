name: Build & Test

on:
  workflow_call:
    inputs:
      is-pr:
        required: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.*

      # The Pizzeria.Tests.Integration tests use Aspire's DistributedApplicationTestingBuilder, which
      # requires Docker (for Postgres/Keycloak containers), a trusted HTTPS dev certificate and Playwright
      # browsers. These tests were previously filtered out (see #505) because they could hang the workflow;
      # they are re-enabled below with bounded timeouts (--blame-hang-timeout) so a stuck run fails fast
      # with diagnostics instead of hanging indefinitely.

      - name: Cache Docker images
        uses: ScribeMD/docker-cache@0.5.0
        with:
          key: docker-${{ runner.os }}-${{ hashFiles('sample/Pizzeria.AppHost/Program.cs', 'sample/Pizzeria.AppHost/Pizzeria.AppHost.csproj') }}
          restore-keys: |
            docker-${{ runner.os }}-

      - name: Trust HTTPS development certificate
        continue-on-error: true
        run: dotnet dev-certs https --trust

      - name: Install dotnet-coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Install ReportGenerator
        if: ${{ inputs.is-pr == true }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0.x'
          preferLatestVersion: true
          includePrerelease: true

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          useConfigFile: true

      - name: Install Dependencies
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build --configuration Release --no-restore --nologo

      - name: Install Playwright Browsers
        run: pwsh sample-tests/Pizzeria.Tests.Integration/bin/Release/net10.0/playwright.ps1 install --with-deps chromium

      - name: Test
        run: >
          dotnet-coverage collect --settings coverage.xml -f cobertura -o ./coverage/coverage.cobertura.xml --
          dotnet test --configuration Release --no-build --nologo
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults
          --blame-hang-timeout 15m
          --blame-hang-dump-type full

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: test-results
          path: TestResults/
          if-no-files-found: warn

      - name: Generate Coverage Report
        if: ${{ inputs.is-pr == true }}
        run: |
          reportgenerator \
            -reports:"coverage/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" \
            -assemblyfilters:"-Fluxor*" \
            -verbosity:"Warning"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ inputs.is-pr == true && github.actor != 'dependabot[bot]' }}
        with:
          recreate: true
          path: coverage-report/SummaryGithub.md

      - name: Check Diff Coverage (90% threshold)
        if: ${{ inputs.is-pr == true && github.actor != 'dependabot[bot]' }}
        uses: ./.github/actions/diff-coverage-check
        with:
          coverage-file: coverage/coverage.cobertura.xml
          threshold: 90
          base-sha: ${{ github.event.pull_request.base.sha }}
          head-sha: ${{ github.sha }}

      - name: Pack
        run: dotnet pack --configuration Release --nologo /p:PackageVersion=${{ steps.version.outputs.fullSemVer }} --output ./output

      - name: Publish to NuGet
        run: dotnet nuget push ./output/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: github.ref == 'refs/heads/main'
