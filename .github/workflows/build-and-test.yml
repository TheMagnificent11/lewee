on:
  workflow_call:
    inputs:
      is-pr:
        required: false
        type: boolean

jobs:
  buildAndTest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.*

      - name: Install Aspire Workload
        run: dotnet workload install aspire

      - name: Install dotnet-coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Install ReportGenerator
        if: ${{ inputs.is-pr == true }}
        run: dotnet tool install --global dotnet-reportgenerator-globaltool

      - name: Install HTTPS development certificate
        run: dotnet dev-certs https --trust

      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@v3.1.11
        with:
          versionSpec: '6.0.x'
          preferLatestVersion: true
          includePrerelease: true

      - name: Determine Version
        id: version
        uses: gittools/actions/gitversion/execute@v3.1.11
        with:
          useConfigFile: true

      - name: Install Dependencies
        run: dotnet restore --nologo

      - name: Build
        run: dotnet build --configuration Release --no-restore --nologo

      - name: Test (Unit Tests Only for Coverage)
        run: dotnet-coverage collect "dotnet test --no-restore --nologo" --settings coverage.xml -f cobertura -o ./coverage/coverage.cobertura.xml

      - name: Generate Coverage Report
        if: ${{ inputs.is-pr == true }}
        run: |
          reportgenerator \
            -reports:"coverage/coverage.cobertura.xml" \
            -targetdir:"coverage-report" \
            -reporttypes:"MarkdownSummaryGithub;Cobertura" \
            -verbosity:"Warning"

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: ${{ inputs.is-pr == true }}
        with:
          recreate: true
          path: coverage-report/SummaryGithub.md

      - name: Check Diff Coverage (90% threshold)
        if: ${{ inputs.is-pr == true }}
        run: |
          echo "🔍 Checking diff coverage for changed source files..."
          
          # Get list of changed .cs files in src/ directory
          CHANGED_FILES=$(git diff --name-only ${{ github.event.pull_request.base.sha }} ${{ github.sha }} | grep '\.cs$' | grep '^src/' || true)
          
          if [ -z "$CHANGED_FILES" ]; then
            echo "✅ No source code files changed. Coverage check passed."
            exit 0
          fi
          
          echo "📋 Changed source files:"
          echo "$CHANGED_FILES"
          
          # Check if coverage report exists
          if [ ! -f "coverage/coverage.cobertura.xml" ]; then
            echo "❌ Coverage report not found. Cannot verify diff coverage."
            echo "This might indicate that no tests were run or coverage collection failed."
            exit 1
          fi
          
          # Parse Cobertura XML and check each changed file
          python3 << 'EOF'
          import xml.etree.ElementTree as ET
          import sys
          import os
          
          def normalize_path(path):
              """Normalize file paths for comparison"""
              return path.replace('\\', '/').lower()
          
          def extract_filename(full_path):
              """Extract just the filename from a full path"""
              return os.path.basename(full_path)
          
          # Load coverage data from Cobertura XML
          try:
              tree = ET.parse('coverage/coverage.cobertura.xml')
              root = tree.getroot()
          except Exception as e:
              print(f"❌ Error reading coverage report: {e}")
              sys.exit(1)
          
          # Get changed files from environment
          changed_files_env = os.environ.get('CHANGED_FILES', '').strip()
          if not changed_files_env:
              print("✅ No changed files to check")
              sys.exit(0)
              
          changed_files = [f.strip() for f in changed_files_env.split('\n') if f.strip()]
          print(f"🔍 Checking coverage for {len(changed_files)} changed files...")
          
          failed_files = []
          checked_files = []
          
          # Parse Cobertura XML - find all classes
          packages = root.findall('.//package')
          classes = []
          for package in packages:
              classes.extend(package.findall('.//class'))
          
          if not classes:
              print("⚠️  No class coverage data found")
          
          for class_elem in classes:
              filename = class_elem.get('filename', '')
              classname = class_elem.get('name', '')
              line_rate = float(class_elem.get('line-rate', '0'))
              
              if not filename:
                  continue
              
              # Check if this file matches any of our changed files
              filename_normalized = normalize_path(filename)
              
              for changed_file in changed_files:
                  changed_file_normalized = normalize_path(changed_file)
                  
                  # Try multiple matching strategies
                  matches = (
                      changed_file_normalized in filename_normalized or
                      filename_normalized.endswith(changed_file_normalized) or
                      extract_filename(changed_file_normalized) == extract_filename(filename_normalized)
                  )
                  
                  if matches:
                      coverage_percentage = round(line_rate * 100, 2)
                      
                      # Get line counts from the XML
                      lines = class_elem.findall('.//line')
                      total_lines = len(lines)
                      covered_lines = len([line for line in lines if line.get('hits', '0') != '0'])
                      
                      checked_files.append({
                          'file': changed_file,
                          'class': classname,
                          'coverage': coverage_percentage,
                          'covered_lines': covered_lines,
                          'total_lines': total_lines,
                          'filename': filename
                      })
                      
                      status = "✅" if coverage_percentage >= 90 else "❌"
                      print(f"{status} {changed_file}: {coverage_percentage}% ({covered_lines}/{total_lines} lines)")
                      
                      if coverage_percentage < 90:
                          failed_files.append({
                              'file': changed_file,
                              'coverage': coverage_percentage,
                              'covered_lines': covered_lines,
                              'total_lines': total_lines
                          })
                      break
          
          # Handle files that weren't found in coverage report
          found_file_names = [extract_filename(normalize_path(f['file'])) for f in checked_files]
          missing_files = []
          
          for changed_file in changed_files:
              if extract_filename(normalize_path(changed_file)) not in found_file_names:
                  missing_files.append(changed_file)
          
          print(f"\n📊 Coverage Summary:")
          print(f"   • Changed files: {len(changed_files)}")
          print(f"   • Files with coverage data: {len(checked_files)}")
          print(f"   • Files without coverage data: {len(missing_files)}")
          
          if missing_files:
              print(f"\n⚠️  Files not found in coverage report:")
              for missing_file in missing_files:
                  print(f"   - {missing_file}")
              print("   This could mean:")
              print("   - Files contain no coverable code (e.g., only interfaces, enums, attributes)")
              print("   - Files are not included in test coverage collection")
              print("   - Files are generated code or excluded from coverage")
          
          # Final result
          if failed_files:
              print(f"\n❌ DIFF COVERAGE CHECK FAILED")
              print(f"   {len(failed_files)} of {len(checked_files)} checked files are below 90% coverage:")
              for file_info in failed_files:
                  needed_lines = max(0, int((file_info['total_lines'] * 0.9) - file_info['covered_lines']))
                  print(f"   - {file_info['file']}: {file_info['coverage']}% (need ~{needed_lines} more covered lines)")
              print(f"\n💡 Please add tests to increase coverage for the files listed above.")
              sys.exit(1)
          elif checked_files:
              print(f"\n✅ DIFF COVERAGE CHECK PASSED")
              print(f"   All {len(checked_files)} checked files meet the 90% coverage threshold!")
              if missing_files:
                  print(f"   Note: {len(missing_files)} files had no coverage data (likely non-coverable code)")
          else:
              print(f"\n⚠️  No coverage data found for any changed files")
              if missing_files and len(missing_files) == len(changed_files):
                  # All files are missing - this might be OK if they're all interfaces/enums
                  print("   All changed files appear to be non-coverable code (interfaces, enums, etc.)")
                  print("✅ Coverage check passed - no coverable code changes detected")
              else:
                  print("❌ Failing build - expected coverage data but found none")
                  sys.exit(1)
          EOF

      - name: Pack
        run: dotnet pack --configuration Release --nologo /p:PackageVersion=${{ steps.version.outputs.fullSemVer }} --output ./output

      - name: Publish to NuGet
        run: dotnet nuget push ./output/*.nupkg --api-key ${{ secrets.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate
        if: github.ref == 'refs/heads/main'
